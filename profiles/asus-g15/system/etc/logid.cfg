devices: ({
  name: "MX Master 3S";
  buttons: ({
    cid: 0xc3;            # thumb / gesture button
    action = {
      type: "Gestures";
      gestures: (
        {
          direction: "Left";      # hold thumb + move left -> next workspace
          mode: "OnRelease";
          action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_TAB"]; };
        },
        {
          direction: "Right";     # hold thumb + move right -> previous workspace
          mode: "OnRelease";
          action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"]; };
        },
        {
          direction: "None";      # plain click does nothing
          mode: "OnRelease";
          action = { type: "None"; };
        }
      );
    };
  });
});
