# All idle behaviour (lock, screen off, sleep) lives here. The shell's own idle
# timeouts in ~/.config/caelestia/shell.json are emptied so they don't overlap.
# What each step does on charger vs battery is in ~/.local/bin/juarchy-idle.
# Rule of thumb: once locked, the laptop sleeps after 2 idle minutes
# (docked on the charger with an external monitor: screens off instead).

general {
    lock_cmd = ~/.local/bin/juarchy-lock
    # Lock before every sleep (lid, suspend button, idle) and hold the sleep
    # until hyprlock is up, so waking always asks for the password.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.local/bin/juarchy-idle resume
    inhibit_sleep = 3
}

# 2 min: locked (e.g. Super+L) -> sleep
listener {
    timeout = 120
    on-timeout = ~/.local/bin/juarchy-idle t120
    on-resume = ~/.local/bin/juarchy-idle resume
}

# 5 min: battery -> lock + screen off
listener {
    timeout = 300
    on-timeout = ~/.local/bin/juarchy-idle t300
    on-resume = ~/.local/bin/juarchy-idle resume
}

# 7 min: locked -> sleep (2 min after the battery lock)
listener {
    timeout = 420
    on-timeout = ~/.local/bin/juarchy-idle t420
    on-resume = ~/.local/bin/juarchy-idle resume
}

# 10 min: battery -> sleep even if unlocked (fallback)
listener {
    timeout = 600
    on-timeout = ~/.local/bin/juarchy-idle t600
}

# 45 min: charger -> lock
listener {
    timeout = 2700
    on-timeout = ~/.local/bin/juarchy-idle t2700
}

# 47 min: locked -> sleep (2 min after the charger lock)
listener {
    timeout = 2820
    on-timeout = ~/.local/bin/juarchy-idle t2820
    on-resume = ~/.local/bin/juarchy-idle resume
}
