# Lockscreen modelled on the "arch linux + hyprland rice setup" video:
# blurred wallpaper, stacked hour/minute clock, day + date, pill password box.
# Launch it with ~/.local/bin/juarchy-lock (Super+L), which refreshes the
# colours below from the current theme before locking.

source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 5, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/.local/state/caelestia/wallpaper/current
    blur_passes = 3
    blur_size = 6
    brightness = 0.85
    contrast = 1.0
    vibrancy = 0.15
}

# Hour
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $lock_text
    font_size = 120
    font_family = Adwaita Sans ExtraBold
    position = 0, 215
    halign = center
    valign = center
}

# Minute
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $lock_text
    font_size = 120
    font_family = Adwaita Sans ExtraBold
    position = 0, 75
    halign = center
    valign = center
}

# Day name
label {
    monitor =
    text = cmd[update:60000] date +"%A"
    color = $lock_text
    font_size = 18
    font_family = CaskaydiaCove Nerd Font Mono SemiBold
    position = 0, -20
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%-d %b"
    color = $lock_text_dim
    font_size = 13
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, -46
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    rounding = -1
    outline_thickness = 2
    outer_color = $lock_outline
    inner_color = $lock_field
    font_color = $lock_text
    font_family = CaskaydiaCove Nerd Font Mono
    check_color = $lock_check
    fail_color = $lock_fail
    capslock_color = $lock_check
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text =
    fail_text = <i>$FAIL</i>
    hide_input = false
    position = 0, -390
    halign = center
    valign = center
}
